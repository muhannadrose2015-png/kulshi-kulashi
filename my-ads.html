<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#232f3e">
<title>إعلاناتي - كلشي كلاشي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
  .order-card {
    background: white;
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }

  .order-image {
    width: 80px;
    height: 80px;
    border-radius: 8px;
    object-fit: cover;
    background: #f0f0f0;
    flex-shrink: 0;
  }

  .order-info {
    flex: 1;
    min-width: 0;
  }

  .order-title {
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 5px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .order-price {
    font-size: 15px;
    font-weight: bold;
    color: #b12704;
    margin-bottom: 5px;
  }

  .order-meta {
    font-size: 11px;
    color: var(--text-light);
    margin-bottom: 8px;
  }

  .order-code-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 8px;
    font-size: 11px;
  }

  .order-code-badge {
    background: #fff9f0;
    color: var(--accent);
    padding: 3px 8px;
    border-radius: 5px;
    font-family: monospace;
    font-weight: bold;
    border: 1px solid #ffe0b2;
    direction: ltr;
  }

  .order-status {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: bold;
  }

  .status-pending {
    background: #fff3cd;
    color: #856404;
  }

  .status-approved {
    background: #d4edda;
    color: #155724;
  }

  .status-rejected {
    background: #f8d7da;
    color: #721c24;
  }

  .status-sold {
    background: #f8d7da;
    color: #721c24;
  }

  .order-actions {
    display: flex;
    gap: 6px;
    margin-top: 8px;
    flex-wrap: wrap;
  }

  .order-actions button {
    padding: 6px 12px;
    border-radius: 6px;
    border: none;
    font-size: 11px;
    font-weight: bold;
    cursor: pointer;
    font-family: inherit;
    transition: 0.2s;
  }

  .btn-view {
    background: #e7e9ec;
    color: var(--primary);
  }

  .btn-track {
    background: #fff9f0;
    color: var(--accent);
    border: 1px solid #ffe0b2;
  }

  .btn-delete {
    background: #ffebee;
    color: var(--danger);
  }

  .btn-sold {
    background: #d4edda;
    color: #155724;
    border: 1px solid #4caf50;
  }

  .btn-unsold {
    background: #fff9f0;
    color: #856404;
    border: 1px solid #ff9900;
  }

  .stats-bar {
    background: var(--primary);
    color: white;
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 15px;
    display: flex;
    justify-content: space-around;
    text-align: center;
  }

  .stat-item {
    flex: 1;
  }

  .stat-value {
    font-size: 22px;
    font-weight: bold;
    color: var(--accent);
  }

  .stat-label {
    font-size: 11px;
    opacity: 0.8;
    margin-top: 3px;
  }
</style>
</head>
<body>

<!-- الهيدر -->
<header class="header">
  <div class="header-top">
    <a href="/" class="logo">
      <img src="/images/logo.png" alt="كلشي كلاشي">
      <span class="logo-text">كلشي كلاشي</span>
    </a>
    <div class="header-user" id="headerUser">...</div>
  </div>
</header>

<!-- المحتوى -->
<main class="container">

  <div class="page-header">
    <a href="/" class="back-btn">→</a>
    <h1>📋 إعلاناتي</h1>
  </div>
  
  <!-- قسم بيانات المستخدم -->
  <div id="userSettingsBox"></div>
  
  <!-- شريط الإحصائيات -->
  <div class="stats-bar" id="statsBar">
    <div class="stat-item">
      <div class="stat-value" id="statTotal">0</div>
      <div class="stat-label">الكل</div>
    </div>
    <div class="stat-item">
      <div class="stat-value" id="statPending">0</div>
      <div class="stat-label">قيد المراجعة</div>
    </div>
    <div class="stat-item">
      <div class="stat-value" id="statApproved">0</div>
      <div class="stat-label">منشورة</div>
    </div>
  </div>

  <!-- قائمة الطلبات -->
  <div id="ordersList">
    <div class="loading">
      <div class="spinner"></div>
      <p style="margin-top:10px;">جارٍ التحميل...</p>
    </div>
  </div>

</main>

<!-- شريط التنقل السفلي -->
<nav class="bottom-nav">
  <a href="/" class="nav-item">
    <span class="nav-icon">🏠</span>
    <span>الرئيسية</span>
  </a>
  <a href="/category.html" class="nav-item">
    <span class="nav-icon">📂</span>
    <span>الأصناف</span>
  </a>
  <a href="/add.html" class="nav-item">
    <span class="nav-icon">➕</span>
    <span>إضافة</span>
  </a>
  <a href="/my-ads.html" class="nav-item active">
    <span class="nav-icon">📋</span>
    <span>إعلاناتي</span>
  </a>
</nav>

<!-- تحميل السكربتات -->
<script src="/js/storage.js"></script>
<script src="/js/app.js"></script>
<script src="/js/ban.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/products.js"></script>
<script src="/js/submit.js"></script>
<script src="/js/settings.js"></script>

<script>
  
(async function init() {
  try {
    await Ban.checkPageAccess();
    Auth.renderUserHeader();
    await Auth.requireRegistration();
    Auth.renderUserHeader();

    // عرض قسم بيانات المستخدم
    Settings.renderUserBox('userSettingsBox');

    await renderMyAds();
  } catch (e) {
    console.error('Init error:', e);
    const container = document.getElementById('ordersList');
    container.innerHTML = '<div class="empty-state"><p>حدث خطأ في التحميل</p></div>';
  }
})();

/* ===== عرض إعلاناتي ===== */
async function renderMyAds() {
  const container = document.getElementById('ordersList');

  // أولاً: تحديث حالات الطلبات من ads.json
  await syncOrderStatuses();

  const orders = KK.getMyOrders();

  // إحصائيات
  const total = orders.length;
  const pending = orders.filter(o => o.status === 'pending').length;
  const approved = orders.filter(o => o.status === 'approved').length;

  document.getElementById('statTotal').textContent = total;
  document.getElementById('statPending').textContent = pending;
  document.getElementById('statApproved').textContent = approved;

  if (orders.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">📭</div>
        <h3>لا توجد إعلانات بعد</h3>
        <p>ابدأ بإضافة أول إعلان لك</p>
        <a href="/add.html" class="btn btn-primary" style="margin-top:15px;">➕ أضف إعلانك الآن</a>
      </div>
    `;
    return;
  }

  container.innerHTML = orders.map(order => {
    const img = (order.images && order.images[0])
      ? order.images[0]
      : 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect fill="%23f0f0f0" width="100" height="100"/><text x="50" y="55" font-size="30" text-anchor="middle" fill="%23999">📷</text></svg>';

    const price = App.formatPrice(order.price, order.currency);
    const statusInfo = getStatusInfo(order.status, order.sold);

    // أزرار البيع (فقط للإعلانات المنشورة وغير المباعة)
    let soldButtons = '';
    if (order.status === 'approved') {
      if (order.sold) {
        soldButtons = `<button class="btn-unsold" onclick="unmarkSold('${order.code}')">↩️ إلغاء البيع</button>`;
      } else {
        soldButtons = `<button class="btn-sold" onclick="markSold('${order.code}')">✅ تم البيع</button>`;
      }
    }

    return `
      <div class="order-card">
        <img src="${img}" class="order-image" alt="${App.escapeHTML(order.title)}">
        <div class="order-info">
          <div class="order-title">${App.escapeHTML(order.title)}</div>
          <div class="order-price">${price}</div>
          <div class="order-meta">
            📍 ${App.escapeHTML(order.city || '')} • 🕐 ${App.formatDate(order.submittedAt)}
          </div>
          <div class="order-code-row">
            <span>رقم الطلب:</span>
            <span class="order-code-badge">${order.code}</span>
          </div>
          <div class="order-status ${statusInfo.class}">
            ${statusInfo.icon} ${statusInfo.text}
          </div>
          <div class="order-actions">
            <button class="btn-view" onclick="viewOrder('${order.code}')">👁️ عرض</button>
            <button class="btn-track" onclick="trackOrder('${order.code}')">🔍 تتبع</button>
            ${soldButtons}
            <button class="btn-delete" onclick="Submit.deleteOrder('${order.code}')">🗑️ حذف</button>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

/* ===== تحديث حالات الطلبات من ads.json ===== */
async function syncOrderStatuses() {
  try {
    const orders = KK.getMyOrders();
    if (orders.length === 0) return;

    const allAds = await Products.loadAll(true);
    let changed = false;

    orders.forEach(order => {
      if (order.status === 'pending') {
        const published = allAds.find(ad =>
          ad.orderCode === order.code ||
          String(ad.id) === String(order.code)
        );

        if (published) {
          order.status = 'approved';
          order.publishedAt = published.publishedAt || published.createdAt;
          // نحفظ حالة البيع من ads.json
          order.sold = !!published.sold;
          order.soldAt = published.soldAt || null;
          changed = true;
        }
      } else if (order.status === 'approved') {
        // نُحدّث حالة البيع إذا تغيّرت
        const published = allAds.find(ad =>
          ad.orderCode === order.code ||
          String(ad.id) === String(order.code)
        );
        if (published) {
          const newSold = !!published.sold;
          if (order.sold !== newSold) {
            order.sold = newSold;
            order.soldAt = published.soldAt || null;
            changed = true;
          }
        }
      }
    });

    if (changed) {
      localStorage.setItem(KK.KEYS.MY_ORDERS, JSON.stringify(orders));
    }
  } catch (e) {
    console.error('syncOrderStatuses error:', e);
  }
}

/* ===== حالة الطلب ===== */
function getStatusInfo(status, sold) {
  if (status === 'approved' && sold) {
    return { class: 'status-sold', icon: '💰', text: 'تم البيع' };
  }
  switch (status) {
    case 'approved':
      return { class: 'status-approved', icon: '✅', text: 'منشور' };
    case 'rejected':
      return { class: 'status-rejected', icon: '❌', text: 'مرفوض' };
    default:
      return { class: 'status-pending', icon: '⏳', text: 'قيد المراجعة' };
  }
}

/* ===== عرض تفاصيل الطلب ===== */
function viewOrder(code) {
  const orders = KK.getMyOrders();
  const order = orders.find(o => o.code === code);
  if (!order) return;

  const images = order.images || [];
  const price = App.formatPrice(order.price, order.currency);

  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.onclick = (e) => { if (e.target === modal) modal.remove(); };

  modal.innerHTML = `
    <div class="modal-box">
      <div class="modal-title">تفاصيل الإعلان</div>
      <div style="margin-bottom:15px; text-align:center;">
        <span class="order-code-badge" style="display:inline-block;">${order.code}</span>
      </div>
      ${images.length > 0 ? `
        <div style="display:grid; grid-template-columns:repeat(auto-fill,minmax(80px,1fr)); gap:8px; margin-bottom:15px;">
          ${images.map(img => `<img src="${img}" style="width:100%; aspect-ratio:1; object-fit:cover; border-radius:8px;">`).join('')}
        </div>
      ` : ''}
      <h3 style="margin-bottom:8px;">${App.escapeHTML(order.title)}</h3>
      <p style="color:#b12704; font-size:20px; font-weight:bold; margin-bottom:10px;">${price}</p>
      <p style="font-size:13px; color:#666; margin-bottom:10px;">📍 ${App.escapeHTML(order.city || '')}</p>
      <p style="font-size:14px; line-height:1.6; white-space:pre-wrap; margin-bottom:15px;">${App.escapeHTML(order.description || '')}</p>
      <button class="btn btn-primary btn-full" onclick="this.closest('.modal-overlay').remove()">إغلاق</button>
    </div>
  `;

  document.body.appendChild(modal);
}

/* ===== تتبع الطلب ===== */
function trackOrder(code) {
  window.location.href = '/track.html?code=' + encodeURIComponent(code);
}

/* ==========================================
   نظام "تم البيع"
   ========================================== */
async function markSold(orderCode) {
  const orders = KK.getMyOrders();
  const order = orders.find(o => o.code === orderCode);
  if (!order) return;

  const user = KK.getUser();
  if (!user) {
    App.toast('يجب تسجيل الدخول', 'error');
    return;
  }

  const confirmed = await showConfirmDialog({
    title: '✅ تم البيع',
    message: `هل تم بيع "${order.title}" فعلاً؟\n\nسيظهر الإعلان للجميع كـ "تم البيع" ويُحذف تلقائياً بعد 7 أيام.`,
    confirmText: '✅ نعم، تم البيع',
    cancelText: 'إلغاء',
    type: 'success'
  });

  if (!confirmed) return;

  App.toast('⏳ جارٍ التعليم...', 'info');

  try {
    const response = await fetch('/api/mark-sold', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        productId: orderCode,
        userPhone: user.phone,
        action: 'mark'
      })
    });

    const data = await response.json();

    if (data.success) {
      order.sold = true;
      order.soldAt = new Date().toISOString();
      localStorage.setItem(KK.KEYS.MY_ORDERS, JSON.stringify(orders));

      App.toast('✅ تم تعليم الإعلان كمباع', 'success');
      await renderMyAds();
    } else {
      App.toast('❌ ' + (data.error || 'فشل التعليم'), 'error');
    }
  } catch (e) {
    console.error('Mark sold error:', e);
    App.toast('❌ فشل الاتصال', 'error');
  }
}

async function unmarkSold(orderCode) {
  const orders = KK.getMyOrders();
  const order = orders.find(o => o.code === orderCode);
  if (!order) return;

  const user = KK.getUser();
  if (!user) return;

  const confirmed = await showConfirmDialog({
    title: '↩️ إلغاء "تم البيع"',
    message: `هل تريد إلغاء تعليم "${order.title}" كمباع؟\n\nسيعود الإعلان متوفراً للبيع.`,
    confirmText: '↩️ نعم، إلغاء البيع',
    cancelText: 'تراجع',
    type: 'warning'
  });

  if (!confirmed) return;

  App.toast('⏳ جارٍ الإلغاء...', 'info');

  try {
    const response = await fetch('/api/mark-sold', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        productId: orderCode,
        userPhone: user.phone,
        action: 'unmark'
      })
    });

    const data = await response.json();

    if (data.success) {
      order.sold = false;
      delete order.soldAt;
      localStorage.setItem(KK.KEYS.MY_ORDERS, JSON.stringify(orders));

      App.toast('✅ تم إلغاء البيع', 'success');
      await renderMyAds();
    } else {
      App.toast('❌ ' + (data.error || 'فشل الإلغاء'), 'error');
    }
  } catch (e) {
    console.error('Unmark sold error:', e);
    App.toast('❌ فشل الاتصال', 'error');
  }
}

/* ===== نافذة تأكيد أنيقة ===== */
function showConfirmDialog({ title, message, confirmText, cancelText, type }) {
  return new Promise((resolve) => {
    const modal = document.createElement('div');
    modal.className = 'modal-overlay';
    modal.onclick = (e) => { if (e.target === modal) { modal.remove(); resolve(false); } };

    const colors = {
      success: { bg: '#e8f5e9', color: '#2e7d32', btn: '#4caf50', icon: '✅' },
      warning: { bg: '#fff9f0', color: '#856404', btn: '#ff9900', icon: '↩️' },
      danger: { bg: '#ffebee', color: '#c62828', btn: '#d32f2f', icon: '⚠️' }
    };
    const c = colors[type] || colors.success;

    modal.innerHTML = `
      <div class="modal-box" style="text-align:center;">
        <div style="background:${c.bg};color:${c.color};padding:20px;border-radius:12px;margin-bottom:15px;">
          <div style="font-size:40px;margin-bottom:10px;">${c.icon}</div>
          <div style="font-weight:bold;font-size:16px;margin-bottom:8px;">${title}</div>
          <div style="font-size:13px;line-height:1.7;white-space:pre-line;">${message}</div>
        </div>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-secondary" style="flex:1;background:#e7e9ec;color:#232f3e;padding:12px;border:none;border-radius:8px;font-family:inherit;font-weight:bold;cursor:pointer;" onclick="this.closest('.modal-overlay').remove(); window.__confirmResolver(false);">
            ${cancelText || 'إلغاء'}
          </button>
          <button class="btn" style="flex:2;background:${c.btn};color:white;padding:12px;border:none;border-radius:8px;font-family:inherit;font-weight:bold;cursor:pointer;" onclick="this.closest('.modal-overlay').remove(); window.__confirmResolver(true);">
            ${confirmText || 'موافق'}
          </button>
        </div>
      </div>
    `;

    window.__confirmResolver = (result) => {
      resolve(result);
      delete window.__confirmResolver;
    };

    document.body.appendChild(modal);
  });
}

/* ===== البحث ===== */
function doSearch() {
  const query = document.getElementById('searchInput')?.value.trim();
  if (!query || query.length < 2) {
    App.toast('اكتب على الأقل حرفين للبحث', 'info');
    return;
  }
  window.location.href = '/category.html?q=' + encodeURIComponent(query);
}
</script>

</body>
</html>
