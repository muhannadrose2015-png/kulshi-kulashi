<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#232f3e">
<title>تفاصيل المنتج - كلشي كلاشي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- الهيدر -->
<header class="header">
  <div class="header-top">
    <a href="/" class="logo">
      <img src="/images/logo.png" alt="كلشي كلاشي">
      <span class="logo-text">كلشي كلاشي</span>
    </a>
    <div class="header-user" id="headerUser">...</div>
  </div>
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="ابحث عن منتج، مدينة، خدمة...">
    <button onclick="doSearch()">🔍</button>
  </div>
</header>

<!-- المحتوى -->
<main class="container">

  <!-- زر الرجوع -->
  <div class="page-header">
    <a href="javascript:history.back()" class="back-btn">→</a>
    <h1>تفاصيل الإعلان</h1>
  </div>

  <!-- تفاصيل المنتج -->
  <div id="productBody">
    <div class="loading">
      <div class="spinner"></div>
      <p style="margin-top:10px;">جارٍ التحميل...</p>
      <p id="productLoadTimeout" style="margin-top:15px;font-size:12px;color:#999;display:none;">
        التحميل يستغرق وقتاً أطول من المعتاد...
        <br>
        <button onclick="location.reload()" style="margin-top:10px;background:#ff9900;color:white;border:none;padding:8px 20px;border-radius:6px;font-family:inherit;font-weight:bold;cursor:pointer;">
          🔄 إعادة المحاولة
        </button>
      </p>
    </div>
  </div>

  <!-- منتجات مشابهة -->
  <div id="similarProducts"></div>

  <!-- قسم التقييمات -->
  <div id="reviewsSection" style="margin-top:20px;"></div>

</main>

<!-- زر إضافة إعلان (عائم) -->
<a href="/add.html" class="add-btn" title="أضف إعلانك">+</a>

<!-- شريط التنقل السفلي -->
<nav class="bottom-nav">
  <a href="/" class="nav-item">
    <span class="nav-icon">🏠</span>
    <span>الرئيسية</span>
  </a>
  <a href="/category.html" class="nav-item">
    <span class="nav-icon">📂</span>
    <span>الأصناف</span>
  </a>
  <a href="/add.html" class="nav-item">
    <span class="nav-icon">➕</span>
    <span>إضافة</span>
  </a>
  <a href="/favorites.html" class="nav-item">
    <span class="nav-icon">❤️</span>
    <span>المفضلة</span>
    <span class="fav-badge" id="favBadge" style="display:none;">0</span>
  </a>
  <a href="/my-ads.html" class="nav-item">
    <span class="nav-icon">📋</span>
    <span>إعلاناتي</span>
  </a>
</nav>

<!-- تحميل السكربتات -->
<script src="/js/storage.js"></script>
<script src="/js/app.js"></script>
<script src="/js/ban.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/products.js"></script>
<script src="/js/favorites.js"></script>

<script>
/* ===== تشغيل الصفحة (نسخة محمية) ===== */
(async function init() {
  // 1. فحص الحظر
  try {
    await Ban.checkPageAccess();
  } catch (e) {
    console.error('Ban check failed:', e);
  }

  // 2. عرض بيانات المستخدم
  try {
    Auth.renderUserHeader();
  } catch (e) {
    console.error('Auth header failed:', e);
  }

  // 3. تحديث عدّاد المفضلة
  try {
    if (typeof Favorites !== 'undefined') {
      Favorites.updateBadge();
    }
  } catch (e) {
    console.error('Favorites badge failed:', e);
  }

  // 4. تحميل صفحة المنتج (الأهم)
  try {
    await Products.initProductPage();
  } catch (e) {
    console.error('Product load failed:', e);
    const bodyEl = document.getElementById('productBody');
    if (bodyEl) {
      bodyEl.innerHTML = `
        <div class="empty-state">
          <div class="empty-state-icon">⚠️</div>
          <h3>تعذّر تحميل المنتج</h3>
          <p>يبدو أن هناك مشكلة في الاتصال</p>
          <button class="btn btn-primary" onclick="location.reload()" style="margin-top:15px;">
            🔄 إعادة المحاولة
          </button>
        </div>
      `;
    }
  }
})();

/* رسالة بعد 10 ثوانٍ إذا لم تُحمّل صفحة المنتج */
setTimeout(() => {
  const bodyEl = document.getElementById('productBody');
  const msg = document.getElementById('productLoadTimeout');
  if (bodyEl && !bodyEl.querySelector('.product-details') && msg) {
    msg.style.display = 'block';
  }
}, 10000);

/* ===== البحث ===== */
function doSearch() {
  const query = document.getElementById('searchInput').value.trim();
  if (query.length < 2) {
    App.toast('اكتب على الأقل حرفين للبحث', 'info');
    return;
  }
  window.location.href = '/category.html?q=' + encodeURIComponent(query);
}

document.getElementById('searchInput').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') doSearch();
});
</script>

</body>
</html>
