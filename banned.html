<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#8b0000">
<meta name="robots" content="noindex, nofollow">
<title>محظور - كلشي كلاشي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Cairo', sans-serif;
  }

  body {
    background: linear-gradient(135deg, #8b0000 0%, #4a0000 100%);
    color: white;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    text-align: center;
  }

  .ban-container {
    max-width: 420px;
    width: 100%;
  }

  .ban-icon {
    font-size: 100px;
    margin-bottom: 20px;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }

  h1 {
    font-size: 28px;
    margin-bottom: 15px;
    color: #ffcccb;
  }

  .ban-message {
    font-size: 15px;
    line-height: 1.8;
    opacity: 0.9;
    margin-bottom: 25px;
  }

  .reason-box {
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 25px;
  }

  .reason-label {
    font-size: 12px;
    opacity: 0.7;
    margin-bottom: 8px;
  }

  .reason-text {
    font-size: 15px;
    font-weight: bold;
    color: #ffcccb;
  }

  .contact-info {
    background: rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    padding: 20px;
    margin-top: 20px;
  }

  .contact-info h3 {
    font-size: 16px;
    margin-bottom: 15px;
    color: #ffcccb;
  }

  .contact-info p {
    font-size: 13px;
    opacity: 0.85;
    line-height: 1.7;
    margin-bottom: 15px;
  }

  /* ===== أزرار التواصل ===== */
  .contact-buttons {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .contact-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 14px 20px;
    border-radius: 10px;
    text-decoration: none;
    font-weight: bold;
    font-size: 15px;
    transition: 0.2s;
    color: white;
    border: none;
    cursor: pointer;
    font-family: inherit;
  }

  .contact-btn:active {
    transform: scale(0.97);
  }

  .btn-whatsapp {
    background: #25D366;
  }

  .btn-whatsapp:hover {
    background: #1da851;
  }

  .btn-telegram {
    background: #0088cc;
  }

  .btn-telegram:hover {
    background: #006699;
  }

  .contact-btn-icon {
    font-size: 20px;
  }

  .footer-note {
    font-size: 11px;
    opacity: 0.5;
    margin-top: 30px;
  }
</style>
</head>
<body>

<div class="ban-container">
  <div class="ban-icon">🚫</div>
  <h1>أنت محظور</h1>

  <div class="ban-message">
    تم حظر حسابك من استخدام موقع <strong>كلشي كلاشي</strong><br>
    بسبب مخالفة شروط الاستخدام
  </div>

  <div class="reason-box" id="reasonBox" style="display:none;">
    <div class="reason-label">السبب:</div>
    <div class="reason-text" id="reasonText"></div>
  </div>

  <div class="contact-info">
    <h3>📩 إذا كنت تعتقد أن هذا خطأ</h3>
    <p>تواصل معنا مباشرة:</p>

    <div class="contact-buttons">
      <a href="https://wa.me/9647856761412?text=مرحباً،%20تم%20حظر%20حسابي%20في%20كلشي%20كلاشي%20وأريد%20الاستفسار" 
         target="_blank" 
         class="contact-btn btn-whatsapp">
        <span class="contact-btn-icon">💬</span>
        <span>تواصل عبر واتساب</span>
      </a>

      <a href="https://t.me/Baya33bot" 
         target="_blank" 
         class="contact-btn btn-telegram">
        <span class="contact-btn-icon">✈️</span>
        <span>تواصل عبر تليجرام</span>
      </a>
    </div>
  </div>

  <div class="footer-note">
    © 2026 كلشي كلاشي - جميع الحقوق محفوظة
  </div>
</div>

<script src="/js/storage.js"></script>
<script src="/js/app.js"></script>

<script>
/* ===== عرض سبب الحظر (إن وُجد) ===== */
(async function init() {
  const reason = App.getURLParam('reason');
  if (reason) {
    document.getElementById('reasonBox').style.display = 'block';
    document.getElementById('reasonText').textContent = decodeURIComponent(reason);
  }
})();
</script>

</body>
</html>
