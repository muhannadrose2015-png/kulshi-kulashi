<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#232f3e">
<meta name="description" content="كلشي كلاشي - سوقك الإلكتروني للإعلانات المبوبة في العراق">
<title>كلشي كلاشي - سوقك الإلكتروني</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- الهيدر -->
<header class="header">
  <div class="header-top">
    <a href="/" class="logo"><img src="/images/logo.png" alt="كلشي كلاشي"></a>
    <div class="header-user" id="headerUser">...</div>
  </div>
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="ابحث عن منتج، مدينة، خدمة...">
    <button onclick="doSearch()">🔍</button>
  </div>
</header>

<!-- المحتوى الرئيسي -->
<main class="container">

  <!-- الأصناف -->
  <h2 class="section-title">تسوق حسب الصنف</h2>
  <div class="categories-grid" id="categoriesGrid">
    <!-- تُعرض عبر JS -->
  </div>

  <!-- أحدث الإعلانات -->
  <h2 class="section-title">🔥 أحدث الإعلانات</h2>
  <div class="products-grid" id="latestProducts">
    <div class="loading" style="grid-column: 1/-1;">
      <div class="spinner"></div>
      <p style="margin-top:10px;">جارٍ التحميل...</p>
    </div>
  </div>

</main>

<!-- زر إضافة إعلان (عائم) -->
<a href="/add.html" class="add-btn" title="أضف إعلانك">+</a>

<!-- شريط التنقل السفلي -->
<nav class="bottom-nav">
  <a href="/" class="nav-item active">
    <span class="nav-icon">🏠</span>
    <span>الرئيسية</span>
  </a>
  <a href="/category.html" class="nav-item">
    <span class="nav-icon">📂</span>
    <span>الأصناف</span>
  </a>
  <a href="/add.html" class="nav-item">
    <span class="nav-icon">➕</span>
    <span>إضافة</span>
  </a>
  <a href="/my-ads.html" class="nav-item">
    <span class="nav-icon">📋</span>
    <span>إعلاناتي</span>
  </a>
</nav>

<!-- Footer -->
<footer class="footer">
  <div class="footer-links">
    <a href="/">الرئيسية</a>
    <a href="/add.html">أضف إعلان</a>
    <a href="/my-ads.html">إعلاناتي</a>
  </div>
  <p>© 2026 كلشي كلاشي - جميع الحقوق محفوظة</p>
</footer>

<!-- تحميل السكربتات -->
<script src="/js/storage.js"></script>
<script src="/js/app.js"></script>
<script src="/js/ban.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/products.js"></script>

<script>
/* ===== تشغيل الصفحة ===== */
(async function init() {
  // فحص الحظر أولاً
  await Ban.checkPageAccess();

  // عرض بيانات المستخدم في الهيدر
  Auth.renderUserHeader();

  // إذا لم يكن مسجلاً، اطلب التسجيل
  await Auth.requireRegistration();

  // إعادة عرض البيانات بعد التسجيل
  Auth.renderUserHeader();

  // تحميل الإعلانات والأصناف
  await Products.initHomePage();
})();

/* ===== البحث ===== */
function doSearch() {
  const query = document.getElementById('searchInput').value.trim();
  if (query.length < 2) {
    App.toast('اكتب على الأقل حرفين للبحث', 'info');
    return;
  }
  window.location.href = '/category.html?q=' + encodeURIComponent(query);
}

// البحث عند الضغط على Enter
document.getElementById('searchInput').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') doSearch();
});
</script>

</body>
</html>
