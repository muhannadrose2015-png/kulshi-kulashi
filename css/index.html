<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كلشي كلاشي - سوقك الإلكتروني</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
  body {
    background: linear-gradient(135deg, #232f3e 0%, #37475a 100%);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    text-align: center;
    padding: 20px;
  }
  .container { max-width: 600px; }
  h1 { font-size: 56px; color: #ff9900; margin-bottom: 20px; }
  p { font-size: 20px; opacity: 0.85; margin-bottom: 15px; }
  .badge {
    display: inline-block;
    background: #ff9900;
    color: #232f3e;
    padding: 8px 20px;
    border-radius: 50px;
    font-weight: bold;
    margin-top: 20px;
    font-size: 14px;
  }
  .footer { margin-top: 50px; font-size: 13px; opacity: 0.5; }
</style>
</head>
<body>
  <div class="container">
    <h1>🛒 كلشي كلاشي</h1>
    <p>سوقك الإلكتروني للإعلانات المبوبة</p>
    <p style="font-size: 15px; opacity: 0.6;">الموقع قيد الإنشاء...</p>
    <div class="badge">🚀 قريباً</div>
    <div class="footer">
      © 2026 كلشي كلاشي - جميع الحقوق محفوظة
    </div>
  </div>
</body>
</html>
