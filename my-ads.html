<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#232f3e">
<title>إعلاناتي - كلشي كلاشي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
  .order-card {
    background: white;
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }

  .order-image {
    width: 80px;
    height: 80px;
    border-radius: 8px;
    object-fit: cover;
    background: #f0f0f0;
    flex-shrink: 0;
  }

  .order-info {
    flex: 1;
    min-width: 0;
  }

  .order-title {
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 5px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .order-price {
    font-size: 15px;
    font-weight: bold;
    color: #b12704;
    margin-bottom: 5px;
  }

  .order-meta {
    font-size: 11px;
    color: var(--text-light);
    margin-bottom: 8px;
  }

  .order-code-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 8px;
    font-size: 11px;
  }

  .order-code-badge {
    background: #fff9f0;
    color: var(--accent);
    padding: 3px 8px;
    border-radius: 5px;
    font-family: monospace;
    font-weight: bold;
    border: 1px solid #ffe0b2;
    direction: ltr;
  }

  .order-status {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: bold;
  }

  .status-pending {
    background: #fff3cd;
    color: #856404;
  }

  .status-approved {
    background: #d4edda;
    color: #155724;
  }

  .status-rejected {
    background: #f8d7da;
    color: #721c24;
  }

  .status-sold {
    background: #f8d7da;
    color: #721c24;
  }

  .status-featured {
    background: #fff3e0;
    color: #e88a00;
    border: 1px solid #ff9900;
  }

  .order-actions {
    display: flex;
    gap: 6px;
    margin-top: 8px;
    flex-wrap: wrap;
  }

  .order-actions button {
    padding: 6px 12px;
    border-radius: 6px;
    border: none;
    font-size: 11px;
    font-weight: bold;
    cursor: pointer;
    font-family: inherit;
    transition: 0.2s;
  }

  .btn-view {
    background: #e7e9ec;
    color: var(--primary);
  }

  .btn-track {
    background: #fff9f0;
    color: var(--accent);
    border: 1px solid #ffe0b2;
  }

  .btn-delete {
    background: #ffebee;
    color: var(--danger);
  }

  .btn-sold {
    background: #d4edda;
    color: #155724;
    border: 1px solid #4caf50;
  }

  .btn-unsold {
    background: #fff9f0;
    color: #856404;
    border: 1px solid #ff9900;
  }

  .btn-promote {
    background: linear-gradient(135deg, #ff9900 0%, #e88a00 100%);
    color: white;
    border: none;
  }

  .btn-promote:active {
    transform: scale(0.97);
  }

  .btn-subscribe {
    background: linear-gradient(135deg, #9c27b0 0%, #7b1fa2 100%);
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 10px;
    font-family: inherit;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    width: 100%;
    margin-bottom: 15px;
    transition: 0.2s;
  }

  .btn-subscribe:active {
    transform: scale(0.98);
  }

  .featured-star {
    color: #ff9900;
    font-size: 14px;
  }

  .stats-bar {
    background: var(--primary);
    color: white;
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 15px;
    display: flex;
    justify-content: space-around;
    text-align: center;
  }

  .stat-item {
    flex: 1;
  }

  .stat-value {
    font-size: 22px;
    font-weight: bold;
    color: var(--accent);
  }

  .stat-label {
    font-size: 11px;
    opacity: 0.8;
    margin-top: 3px;
  }

  #guestWarning {
    display: none;
    background: linear-gradient(135deg, #fff9f0 0%, #fff3e0 100%);
    border: 2px dashed var(--accent);
    border-radius: 12px;
    padding: 30px 20px;
    text-align: center;
    margin-bottom: 15px;
  }

  #guestWarning .guest-icon {
    font-size: 60px;
    margin-bottom: 15px;
  }

  #guestWarning h3 {
    color: var(--primary);
    font-size: 18px;
    margin-bottom: 10px;
  }

  #guestWarning p {
    color: var(--text-light);
    font-size: 13px;
    line-height: 1.7;
    margin-bottom: 20px;
  }

  #guestWarning .btn {
    padding: 12px 25px;
    font-size: 15px;
  }

  /* ==========================================
     واجهة الترقية والاشتراك
     ========================================== */
  .promote-info-box {
    background: #f8f9fa;
    border-radius: 10px;
    padding: 15px;
    margin-bottom: 15px;
    text-align: center;
  }

  .promote-info-title {
    font-weight: bold;
    color: var(--primary);
    font-size: 14px;
    margin-bottom: 10px;
  }

  .promote-info-price {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  .promote-price-tag {
    font-size: 22px;
    font-weight: bold;
    color: #ff9900;
  }

  .promote-price-duration {
    font-size: 13px;
    color: #666;
    background: #fff;
    padding: 4px 10px;
    border-radius: 15px;
  }

  .promote-benefits {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 15px;
  }

  .promote-benefit-item {
    background: #e8f5e9;
    color: #2e7d32;
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: bold;
    text-align: center;
  }

  .payment-info {
    background: #f0f2f5;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 15px;
  }

  .payment-info-title {
    font-weight: bold;
    color: var(--primary);
    font-size: 13px;
    margin-bottom: 8px;
  }

  .payment-info-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 0;
    font-size: 13px;
    color: #444;
  }

  .payment-number {
    font-family: monospace;
    font-size: 13px;
    font-weight: bold;
    color: #ff9900;
    background: white;
    padding: 4px 8px;
    border-radius: 6px;
    direction: ltr;
    letter-spacing: 1px;
    cursor: pointer;
    user-select: all;
  }
</style>
</head>
<body>

<!-- الهيدر -->
<header class="header">
  <div class="header-top">
    <a href="/" class="logo">
      <img src="/images/logo.png" alt="كلشي كلاشي">
      <span class="logo-text">كلشي كلاشي</span>
    </a>
    <div class="header-user" id="headerUser">...</div>
  </div>
</header>

<!-- المحتوى -->
<main class="container">

  <div class="page-header">
    <a href="/" class="back-btn">→</a>
    <h1>📋 إعلاناتي</h1>
  </div>

  <!-- تنبيه الزائر -->
  <div id="guestWarning">
    <div class="guest-icon">👋</div>
    <h3>مرحباً بك كزائر</h3>
    <p>
      لعرض إعلاناتك، يرجى التسجيل أولاً<br>
      سجّل مجاناً لتصفح وإدارة إعلاناتك
    </p>
    <button class="btn btn-primary" onclick="Auth.showRegisterModal(() => location.reload())">
      ✍️ سجّل الآن
    </button>

  <!-- المحتوى (يظهر فقط للمسجّلين) -->
  <div id="registeredContent" style="display:none;">
    <!-- قسم بيانات المستخدم -->
    <div id="userSettingsBox"></div>

    <!-- زر الاشتراك المميز -->
    <button class="btn-subscribe" onclick="Promote.subscribe()">
      💎 اشترك في الباقة المميزة - 15,000 د.ع/شهر
    </button>

    <!-- قسم الحد الأسبوعي -->
    <div id="quotaBox"></div>

    <!-- شريط الإحصائيات -->
    <div class="stats-bar" id="statsBar">
      <div class="stat-item">
        <div class="stat-value" id="statTotal">0</div>
        <div class="stat-label">الكل</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="statPending">0</div>
        <div class="stat-label">قيد المراجعة</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="statApproved">0</div>
        <div class="stat-label">منشورة</div>
      </div>
    </div>

    <!-- قائمة الطلبات -->
    <div id="ordersList">
      <div class="loading">
        <div class="spinner"></div>
        <p style="margin-top:10px;">جارٍ التحميل...</p>
      </div>
    </div>
  </div>

<!-- شريط التنقل السفلي -->
<nav class="bottom-nav">
  <a href="/" class="nav-item">
    <span class="nav-icon">🏠</span>
    <span>الرئيسية</span>
  </a>
  <a href="/category.html" class="nav-item">
    <span class="nav-icon">📂</span>

  <a href="/favorites.html" class="nav-item">
    <span class="nav-icon">❤️</span>

  </a>
  <a href="/my-ads.html" class="nav-item">
    <span class="nav-icon">📋</span>
    <span>إعلاناتي</span>

<!-- تحميل السكربتات -->
<script src="/js/storage.js"></script>
<script src="/js/app.js"></script>
<script src="/js/ban.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/products.js"></script>
<script src="/js/submit.js"></script>
<script src="/js/settings.js"></script>
<script src="/js/quota.js"></script>
<script src="/js/promote.js"></script>
  <script src="/js/favorites.js"></script>

<script>
/* ===== تشغيل الصفحة ===== */
(async function init() {
  try {
    await Ban.checkPageAccess();
    Auth.renderUserHeader();

    // إذا كان زائراً → أظهر تنبيه التسجيل
    if (!Auth.isRegistered()) {
      document.getElementById('guestWarning').style.display = 'block';
      document.getElementById('registeredContent').style.display = 'none';
      return;
    }

    // مسجّل → أظهر المحتوى
    document.getElementById('guestWarning').style.display = 'none';
    document.getElementById('registeredContent').style.display = 'block';

    // عرض قسم بيانات المستخدم
    Settings.renderUserBox('userSettingsBox');

    // عرض الحد الأسبوعي
    await Quota.render('quotaBox');

    // عرض الإعلانات
    await renderMyAds();
    await checkRejectedAds();
  } catch (e) {
    console.error('Init error:', e);
    const container = document.getElementById('ordersList');
    if (container) {
      container.innerHTML = '<div class="empty-state"><p>حدث خطأ في التحميل</p></div>';
    }
  }
})();

/* ===== عرض إعلاناتي ===== */
async function renderMyAds() {
  const container = document.getElementById('ordersList');

  await syncOrderStatuses();

  const orders = KK.getMyOrders();

  const total = orders.length;
  const pending = orders.filter(o => o.status === 'pending').length;
  const approved = orders.filter(o => o.status === 'approved').length;

  document.getElementById('statTotal').textContent = total;
  document.getElementById('statPending').textContent = pending;
  document.getElementById('statApproved').textContent = approved;

  if (orders.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">📭</div>
        <h3>لا توجد إعلانات بعد</h3>
        <p>ابدأ بإضافة أول إعلان لك</p>
        <a href="/add.html" class="btn btn-primary" style="margin-top:15px;">➕ أضف إعلانك الآن</a>
      </div>
    `;
    return;
  }

  container.innerHTML = orders.map(order => {
    const img = (order.images && order.images[0])
      ? order.images[0]
      : 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect fill="%23f0f0f0" width="100" height="100"/><text x="50" y="55" font-size="30" text-anchor="middle" fill="%23999">📷</text></svg>';

    const price = App.formatPrice(order.price, order.currency);
    const statusInfo = getStatusInfo(order.status, order.sold, order.isFeatured);

    // أزرار العمليات
    let actionButtons = '';

    if (order.status === 'approved') {
      if (order.sold) {
        actionButtons += `<button class="btn-unsold" onclick="unmarkSold('${order.code}')">↩️ إلغاء البيع</button>`;
      } else {
        actionButtons += `<button class="btn-sold" onclick="markSold('${order.code}')">✅ تم البيع</button>`;

        // زر الترقية (فقط إذا لم يكن مميزاً)
        if (!order.isFeatured) {
          actionButtons += `<button class="btn-promote" onclick="Promote.promoteAd('${order.code}')">⭐ ترقية</button>`;
        }
      }
    }

    // نجوم التمييز في العنوان
    const featuredStar = order.isFeatured ? '<span class="featured-star">⭐</span> ' : '';

    return `
      <div class="order-card">
        <img src="${img}" class="order-image" alt="${App.escapeHTML(order.title)}">
        <div class="order-info">
          <div class="order-title">${featuredStar}${App.escapeHTML(order.title)}</div>
          <div class="order-price">${price}</div>
          <div class="order-meta">
            📍 ${App.escapeHTML(order.city || '')} • 🕐 ${App.formatDate(order.submittedAt)}
          </div>
          <div class="order-code-row">
            <span>رقم الطلب:</span>
            <span class="order-code-badge">${order.code}</span>
          </div>
          <div class="order-status ${statusInfo.class}">
  ${statusInfo.icon} ${statusInfo.text}
</div>
${order.status === 'rejected' ? `
  <div class="rejected-notice">
    ⚠️ <strong>تم رفض إعلانك</strong>
    ${order.rejectReason ? `<br>📋 <strong>السبب:</strong> ${App.escapeHTML(order.rejectReason)}` : ''}
    <br><small style="opacity:0.8;">يمكنك مراجعة السبب وتصحيح الإعلان ثم إعادة نشره</small>
  </div>
` : ''}
          <div class="order-actions">
            <button class="btn-view" onclick="viewOrder('${order.code}')">👁️ عرض</button>
            <button class="btn-track" onclick="trackOrder('${order.code}')">🔍 تتبع</button>
            ${actionButtons}
            <button class="btn-delete" onclick="Submit.deleteOrder('${order.code}')">🗑️ حذف</button>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

/* ===== تحديث حالات الطلبات من ads.json ===== */
async function syncOrderStatuses() {
  try {
    const orders = KK.getMyOrders();
    if (orders.length === 0) return;

    const allAds = await Products.loadAll(true);
    let changed = false;

    orders.forEach(order => {
      const published = allAds.find(ad =>
        ad.orderCode === order.code ||
        String(ad.id) === String(order.code)
      );

      if (published) {
        if (order.status === 'pending') {
          order.status = 'approved';
          order.publishedAt = published.publishedAt || published.createdAt;
          changed = true;
        }
        // حالة البيع
        const newSold = !!published.sold;
        if (order.sold !== newSold) {
          order.sold = newSold;
          order.soldAt = published.soldAt || null;
          changed = true;
        }
        // حالة التمييز
        const newFeatured = !!published.isFeatured;
        if (order.isFeatured !== newFeatured) {
          order.isFeatured = newFeatured;
          order.featuredUntil = published.featuredUntil || null;
          changed = true;
        }
      }
    });

    if (changed) {
      localStorage.setItem(KK.KEYS.MY_ORDERS, JSON.stringify(orders));
    }
  } catch (e) {
    console.error('syncOrderStatuses error:', e);
  }
}

/* ===== حالة الطلب ===== */
function getStatusInfo(status, sold, isFeatured) {
  if (status === 'approved' && sold) {
    return { class: 'status-sold', icon: '💰', text: 'تم البيع' };
  }
  if (status === 'approved' && isFeatured) {
    return { class: 'status-featured', icon: '⭐', text: 'مميز' };
  }
  switch (status) {
    case 'approved':
      return { class: 'status-approved', icon: '✅', text: 'منشور' };
    case 'rejected':
      return { class: 'status-rejected', icon: '❌', text: 'مرفوض' };
    default:
      return { class: 'status-pending', icon: '⏳', text: 'قيد المراجعة' };
  }
}

/* ===== عرض تفاصيل الطلب ===== */
function viewOrder(code) {
  const orders = KK.getMyOrders();
  const order = orders.find(o => o.code === code);
  if (!order) return;

  const images = order.images || [];
  const price = App.formatPrice(order.price, order.currency);

  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.onclick = (e) => { if (e.target === modal) modal.remove(); };

  modal.innerHTML = `
    <div class="modal-box">
      <div class="modal-title">تفاصيل الإعلان</div>
      <div style="margin-bottom:15px; text-align:center;">
        <span class="order-code-badge" style="display:inline-block;">${order.code}</span>
      </div>
      ${images.length > 0 ? `
        <div style="display:grid; grid-template-columns:repeat(auto-fill,minmax(80px,1fr)); gap:8px; margin-bottom:15px;">
          ${images.map(img => `<img src="${img}" style="width:100%; aspect-ratio:1; object-fit:cover; border-radius:8px;">`).join('')}
        </div>
      ` : ''}
      <h3 style="margin-bottom:8px;">${App.escapeHTML(order.title)}</h3>
      <p style="color:#b12704; font-size:20px; font-weight:bold; margin-bottom:10px;">${price}</p>
      <p style="font-size:13px; color:#666; margin-bottom:10px;">📍 ${App.escapeHTML(order.city || '')}</p>
      <p style="font-size:14px; line-height:1.6; white-space:pre-wrap; margin-bottom:15px;">${App.escapeHTML(order.description || '')}</p>
      <button class="btn btn-primary btn-full" onclick="this.closest('.modal-overlay').remove()">إغلاق</button>
    </div>
  `;

  document.body.appendChild(modal);
}

/* ===== تتبع الطلب ===== */
function trackOrder(code) {
  window.location.href = '/track.html?code=' + encodeURIComponent(code);
}

/* ==========================================
   نظام "تم البيع"
   ========================================== */
async function markSold(orderCode) {
  const orders = KK.getMyOrders();
  const order = orders.find(o => o.code === orderCode);
  if (!order) return;

  const user = KK.getUser();
  if (!user) {
    App.toast('يجب تسجيل الدخول', 'error');
    return;
  }

  const confirmed = await showConfirmDialog({
    title: '✅ تم البيع',
    message: `هل تم بيع "${order.title}" فعلاً؟\n\nسيظهر الإعلان للجميع كـ "تم البيع" ويُحذف تلقائياً بعد 7 أيام.`,
    confirmText: '✅ نعم، تم البيع',
    cancelText: 'إلغاء',
    type: 'success'
  });

  if (!confirmed) return;

  App.toast('⏳ جارٍ التعليم...', 'info');

  try {
    const response = await fetch('/api/mark-sold', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        productId: orderCode,
        userId: KK.getUserId(),
        action: 'mark'
      })
    });

    const data = await response.json();

    if (data.success) {
      order.sold = true;
      order.soldAt = new Date().toISOString();
      localStorage.setItem(KK.KEYS.MY_ORDERS, JSON.stringify(orders));

      App.toast('✅ تم تعليم الإعلان كمباع', 'success');
      await renderMyAds();
    } else {
      App.toast('❌ ' + (data.error || 'فشل التعليم'), 'error');
    }
  } catch (e) {
    console.error('Mark sold error:', e);
    App.toast('❌ فشل الاتصال', 'error');
  }
}

async function unmarkSold(orderCode) {
  const orders = KK.getMyOrders();
  const order = orders.find(o => o.code === orderCode);
  if (!order) return;

  const user = KK.getUser();
  if (!user) return;

  const confirmed = await showConfirmDialog({
    title: '↩️ إلغاء "تم البيع"',
    message: `هل تريد إلغاء تعليم "${order.title}" كمباع؟\n\nسيعود الإعلان متوفراً للبيع.`,
    confirmText: '↩️ نعم، إلغاء البيع',
    cancelText: 'تراجع',
    type: 'warning'
  });

  if (!confirmed) return;

  App.toast('⏳ جارٍ الإلغاء...', 'info');

  try {
    const response = await fetch('/api/mark-sold', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        productId: orderCode,
        userId: KK.getUserId(),
        action: 'unmark'
      })
    });

    const data = await response.json();

    if (data.success) {
      order.sold = false;
      delete order.soldAt;
      localStorage.setItem(KK.KEYS.MY_ORDERS, JSON.stringify(orders));

      App.toast('✅ تم إلغاء البيع', 'success');
      await renderMyAds();
    } else {
      App.toast('❌ ' + (data.error || 'فشل الإلغاء'), 'error');
    }
  } catch (e) {
    console.error('Unmark sold error:', e);
    App.toast('❌ فشل الاتصال', 'error');
  }
}

/* ===== نافذة تأكيد ===== */
function showConfirmDialog({ title, message, confirmText, cancelText, type }) {
  return new Promise((resolve) => {
    const modal = document.createElement('div');
    modal.className = 'modal-overlay';
    modal.onclick = (e) => { if (e.target === modal) { modal.remove(); resolve(false); } };

    const colors = {
      success: { bg: '#e8f5e9', color: '#2e7d32', btn: '#4caf50', icon: '✅' },
      warning: { bg: '#fff9f0', color: '#856404', btn: '#ff9900', icon: '↩️' },
      danger: { bg: '#ffebee', color: '#c62828', btn: '#d32f2f', icon: '⚠️' }
    };
    const c = colors[type] || colors.success;

    modal.innerHTML = `
      <div class="modal-box" style="text-align:center;">
        <div style="background:${c.bg};color:${c.color};padding:20px;border-radius:12px;margin-bottom:15px;">
          <div style="font-size:40px;margin-bottom:10px;">${c.icon}</div>
          <div style="font-weight:bold;font-size:16px;margin-bottom:8px;">${title}</div>
          <div style="font-size:13px;line-height:1.7;white-space:pre-line;">${message}</div>
        </div>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-secondary" style="flex:1;background:#e7e9ec;color:#232f3e;padding:12px;border:none;border-radius:8px;font-family:inherit;font-weight:bold;cursor:pointer;" onclick="this.closest('.modal-overlay').remove(); window.__confirmResolver(false);">
            ${cancelText || 'إلغاء'}
          </button>
          <button class="btn" style="flex:2;background:${c.btn};color:white;padding:12px;border:none;border-radius:8px;font-family:inherit;font-weight:bold;cursor:pointer;" onclick="this.closest('.modal-overlay').remove(); window.__confirmResolver(true);">
            ${confirmText || 'موافق'}
          </button>
        </div>
      </div>
    `;

    window.__confirmResolver = (result) => {
      resolve(result);
      delete window.__confirmResolver;
    };

    document.body.appendChild(modal);
  });
}

/* ===== البحث ===== */
function doSearch() {
  const query = document.getElementById('searchInput')?.value.trim();
  if (!query || query.length < 2) {
    App.toast('اكتب على الأقل حرفين للبحث', 'info');
    return;
  }
  window.location.href = '/category.html?q=' + encodeURIComponent(query);
}

  /* ==========================================
   فحص الإعلانات المرفوضة
   ========================================== */
async function checkRejectedAds() {
  try {
    const orders = KK.getMyOrders();
    const pending = orders.filter(o => o.status === 'pending');

    if (pending.length === 0) return;

    const codes = pending.map(o => o.code);

    const response = await fetch('/api/check-rejected', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ orderCodes: codes })
    });

    const data = await response.json();

    if (!data.success || !data.rejected || data.rejected.length === 0) return;

    // تحديث الإعلانات المرفوضة محلياً
    let changed = false;

    for (const rejected of data.rejected) {
      const order = orders.find(o => o.code === rejected.orderCode);
      if (order && order.status === 'pending') {
        order.status = 'rejected';
        order.rejectedAt = rejected.rejectedAt;
        order.rejectReason = rejected.reason;
        changed = true;
      }
    }

    if (changed) {
      localStorage.setItem(KK.KEYS.MY_ORDERS, JSON.stringify(orders));
      // إعادة عرض الإعلانات
      await renderMyAds();
    }

  } catch (e) {
    console.error('Check rejected error:', e);
  }
}
