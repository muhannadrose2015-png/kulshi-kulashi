<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#232f3e">
<title>أضف إعلانك - كلشي كلاشي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
  .form-container {
    background: white;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    margin-bottom: 15px;
  }

  .form-container label {
    display: block;
    margin: 15px 0 6px;
    font-weight: bold;
    font-size: 14px;
    color: var(--primary);
  }

  .form-container label .required {
    color: var(--danger);
  }

  .form-container input[type="text"],
  .form-container input[type="number"],
  .form-container input[type="tel"],
  .form-container select,
  .form-container textarea {
    width: 100%;
    padding: 12px;
    border: 2px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: 0.2s;
    background: #fafafa;
  }

  .form-container input:focus,
  .form-container select:focus,
  .form-container textarea:focus {
    border-color: var(--accent);
    background: white;
  }

  .form-container textarea {
    resize: vertical;
    min-height: 100px;
  }

  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  /* ===== الصور ===== */
  .upload-area {
    border: 2px dashed var(--border);
    border-radius: 10px;
    padding: 25px 15px;
    text-align: center;
    cursor: pointer;
    transition: 0.2s;
    background: #fafafa;
  }

  .upload-area:hover {
    border-color: var(--accent);
    background: #fff9f0;
  }

  .upload-area-icon {
    font-size: 40px;
    margin-bottom: 8px;
  }

  .upload-area p {
    color: var(--text-light);
    font-size: 13px;
    margin: 3px 0;
  }

  .upload-area input[type="file"] {
    display: none;
  }

  #uploadPreview {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
    gap: 8px;
    margin-top: 12px;
  }

  .upload-thumb {
    position: relative;
    aspect-ratio: 1;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--border);
  }

  .upload-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .remove-thumb {
    position: absolute;
    top: 3px;
    left: 3px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: rgba(211, 47, 47, 0.9);
    color: white;
    border: none;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }

  .thumb-size {
    position: absolute;
    bottom: 3px;
    right: 3px;
    background: rgba(0,0,0,0.6);
    color: white;
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 10px;
  }

  /* ===== شريط التقدم ===== */
  #uploadProgress {
    display: none;
    margin: 15px 0;
  }

  .progress-bar {
    background: #eee;
    height: 10px;
    border-radius: 10px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), #ffbb33);
    transition: width 0.3s;
    border-radius: 10px;
  }

  .progress-text {
    text-align: center;
    font-size: 13px;
    color: var(--text-light);
    margin-top: 8px;
  }

  /* ===== الأخطاء ===== */
  #formError {
    display: none;
    background: #ffebee;
    color: var(--danger);
    padding: 12px;
    border-radius: 8px;
    border-right: 4px solid var(--danger);
    margin: 15px 0;
    font-size: 14px;
  }

  /* ===== زر الإرسال ===== */
  #submitBtn {
    width: 100%;
    padding: 15px;
    font-size: 16px;
    margin-top: 20px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 10px;
    font-weight: bold;
    font-family: inherit;
    cursor: pointer;
    transition: 0.2s;
  }

  #submitBtn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  #submitBtn:not(:disabled):active {
    background: #e88a00;
  }

  /* ===== شاشة النجاح ===== */
  #successScreen {
    display: none;
  }

  .success-box {
    background: white;
    border-radius: 15px;
    padding: 30px 20px;
    text-align: center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
  }

  .success-icon {
    font-size: 70px;
    margin-bottom: 15px;
    animation: bounceIn 0.5s;
  }

  @keyframes bounceIn {
    0% { transform: scale(0); }
    60% { transform: scale(1.2); }
    100% { transform: scale(1); }
  }

  .success-box h2 {
    color: var(--primary);
    font-size: 22px;
    margin-bottom: 10px;
  }

  .success-box p {
    color: var(--text-light);
    font-size: 14px;
    margin-bottom: 20px;
  }

  .order-code-box {
    background: #fff9f0;
    border: 2px dashed var(--accent);
    border-radius: 12px;
    padding: 18px;
    margin: 20px 0;
  }

  .order-code-label {
    font-size: 13px;
    color: var(--text-light);
    margin-bottom: 5px;
  }

  .order-code {
    font-size: 26px;
    font-weight: bold;
    color: var(--accent);
    letter-spacing: 1px;
    font-family: monospace;
    direction: ltr;
  }

  .order-code-hint {
    font-size: 11px;
    color: var(--text-light);
    margin-top: 8px;
  }

  .success-actions {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 20px;
  }

  .success-actions .btn {
    width: 100%;
  }
</style>
</head>
<body>

<!-- الهيدر -->
<header class="header">
  <div class="header-top">
    <a href="/" class="logo">
      <img src="/images/logo.png" alt="كلشي كلاشي">
      <span class="logo-text">كلشي كلاشي</span>
    </a>
    <div class="header-user" id="headerUser">...</div>
  </div>
</header>

<!-- المحتوى -->
<main class="container">

  <!-- رأس الصفحة -->
  <div class="page-header">
    <a href="/" class="back-btn">→</a>
    <h1>➕ أضف إعلانك</h1>
  </div>

  <!-- نموذج الإعلان -->
  <form id="adForm" class="form-container" onsubmit="Submit.submitAd(event)">

    <div id="formError"></div>

    <label>عنوان الإعلان <span class="required">*</span></label>
    <input type="text" id="adTitle" placeholder="مثال: آيفون 15 برو ماكس نظيف" maxlength="100" required>

    <label>الصنف <span class="required">*</span></label>
    <select id="adCategory" required>
      <option value="">-- اختر الصنف --</option>
    </select>

    <div class="form-row">
      <div>
        <label>السعر <span class="required">*</span></label>
        <input type="number" id="adPrice" placeholder="مثال: 250000" min="1" required>
      </div>
      <div>
        <label>العملة</label>
        <select id="adCurrency">
          <option value="IQD">دينار عراقي (د.ع)</option>
          <option value="USD">دولار ($)</option>
          <option value="SAR">ريال سعودي (ر.س)</option>
          <option value="AED">درهم إماراتي (د.إ)</option>
        </select>
      </div>
    </div>

    <label>المدينة <span class="required">*</span></label>
    <input type="text" id="adCity" placeholder="مثال: بغداد" maxlength="30" required>

    <label>رقم الواتساب <span class="required">*</span></label>
    <input type="tel" id="adWhatsapp" placeholder="07XXXXXXXXX أو 9647XXXXXXXXX" maxlength="15" required>

    <label>الوصف <span class="required">*</span></label>
    <textarea id="adDescription" placeholder="اكتب وصفاً مفصلاً للمنتج... (10 - 2000 حرف)" maxlength="2000" required></textarea>

    <label>صور الإعلان <span class="required">*</span></label>
    <div class="upload-area" onclick="document.getElementById('imageInput').click()">
      <div class="upload-area-icon">📷</div>
      <p><strong>اضغط لإضافة صور</strong></p>
      <p>حتى 5 صور • كل صورة حتى 400KB</p>
      <input type="file" id="imageInput" accept="image/*" multiple>
    </div>
    <div id="uploadPreview"></div>

    <div id="uploadProgress"></div>

    <button type="submit" id="submitBtn">📤 إرسال الإعلان للمراجعة</button>

  </form>

  <!-- شاشة النجاح -->
  <div id="successScreen"></div>

</main>

<!-- شريط التنقل السفلي -->
<nav class="bottom-nav">
  <a href="/" class="nav-item">
    <span class="nav-icon">🏠</span>
    <span>الرئيسية</span>
  </a>
  <a href="/category.html" class="nav-item">
    <span class="nav-icon">📂</span>
    <span>الأصناف</span>
  </a>
  <a href="/add.html" class="nav-item active">
    <span class="nav-icon">➕</span>
    <span>إضافة</span>
  </a>
  <a href="/my-ads.html" class="nav-item">
    <span class="nav-icon">📋</span>
    <span>إعلاناتي</span>
  </a>
</nav>

<!-- تحميل السكربتات -->
<script src="/js/storage.js"></script>
<script src="/js/app.js"></script>
<script src="/js/ban.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/products.js"></script>
<script src="/js/uploader.js"></script>
<script src="/js/submit.js"></script>

<script>
/* ===== تشغيل الصفحة ===== */
(async function init() {
  await Ban.checkPageAccess();
  Auth.renderUserHeader();
  await Auth.requireRegistration();
  Auth.renderUserHeader();

  // ملء قائمة الأصناف
  const cats = await Products.getCategories();
  const select = document.getElementById('adCategory');
  cats.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c.id;
    opt.textContent = `${c.icon} ${c.name}`;
    select.appendChild(opt);
  });

  // ربط حقل الصور
  Uploader.bindInput('imageInput');
})();
</script>

</body>
</html>
