<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#232f3e">
<title>تفاصيل المنتج - كلشي كلاشي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- الهيدر -->
<header class="header">
  <div class="header-top">
<a href="/" class="logo"><img src="/images/logo.png" alt="كلشي كلاشي"></a>
    <div class="header-user" id="headerUser">...</div>
  </div>
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="ابحث عن منتج، مدينة، خدمة...">
    <button onclick="doSearch()">🔍</button>
  </div>
</header>

<!-- المحتوى -->
<main class="container">

  <!-- زر الرجوع -->
  <div class="page-header">
    <a href="javascript:history.back()" class="back-btn">→</a>
    <h1>تفاصيل الإعلان</h1>
  </div>

  <!-- تفاصيل المنتج -->
  <div id="productBody">
    <div class="loading">
      <div class="spinner"></div>
      <p style="margin-top:10px;">جارٍ التحميل...</p>
    </div>
  </div>

  <!-- منتجات مشابهة -->
  <div id="similarProducts"></div>

</main>

<!-- زر إضافة إعلان (عائم) -->
<a href="/add.html" class="add-btn" title="أضف إعلانك">+</a>

<!-- شريط التنقل السفلي -->
<nav class="bottom-nav">
  <a href="/" class="nav-item">
    <span class="nav-icon">🏠</span>
    <span>الرئيسية</span>
  </a>
  <a href="/category.html" class="nav-item">
    <span class="nav-icon">📂</span>
    <span>الأصناف</span>
  </a>
  <a href="/add.html" class="nav-item">
    <span class="nav-icon">➕</span>
    <span>إضافة</span>
  </a>
  <a href="/my-ads.html" class="nav-item">
    <span class="nav-icon">📋</span>
    <span>إعلاناتي</span>
  </a>
</nav>

<!-- Footer -->
<footer class="footer">
  <div class="footer-links">
    <a href="/">الرئيسية</a>
    <a href="/add.html">أضف إعلان</a>
    <a href="/my-ads.html">إعلاناتي</a>
  </div>
  <p>© 2026 كلشي كلاشي - جميع الحقوق محفوظة</p>
</footer>

<!-- تحميل السكربتات -->
<script src="/js/storage.js"></script>
<script src="/js/app.js"></script>
<script src="/js/ban.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/products.js"></script>

<script>
/* ===== تشغيل الصفحة ===== */
(async function init() {
  await Ban.checkPageAccess();
  Auth.renderUserHeader();
  await Auth.requireRegistration();
  Auth.renderUserHeader();
  await Products.initProductPage();
})();

/* ===== البحث ===== */
function doSearch() {
  const query = document.getElementById('searchInput').value.trim();
  if (query.length < 2) {
    App.toast('اكتب على الأقل حرفين للبحث', 'info');
    return;
  }
  window.location.href = '/category.html?q=' + encodeURIComponent(query);
}

document.getElementById('searchInput').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') doSearch();
});
</script>

</body>
</html>
